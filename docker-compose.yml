services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: crownrank
      POSTGRES_USER: crownrank
      POSTGRES_PASSWORD: crownrank_dev
    ports:
      - "5432:5432"
    volumes:
      - crownrank-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crownrank -d crownrank"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  crownrank-postgres:

